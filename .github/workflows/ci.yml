name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install --no-deps "$(grep -o 'https://github.com/blackdiamondhub/bdh-sdk/releases/download/[^ ]*\.whl' runtime/requirements.in)"
      - run: ruff check .
      - run: python -m pytest -q -p no:cacheprovider --deselect tests/test_integration_docker.py
        env:
          BDH_NETWORK_TESTS: "1"

  integration:
    # Builds both images, pushes the base and the hello app image (made by the
    # SDK's builder, like the catalog does) to a local registry, then installs,
    # runs, upgrades and rolls back hello through the real DockerDriver, probes
    # the sandbox and enforces the memory budget.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: blackdiamondhub/bdh-sdk
          ref: v0
          path: .sdk
      - run: bash scripts/build.sh
        env:
          BDH_SDK: .sdk
      - run: sh scripts/integration.sh
        env:
          BDH_RSS_LIMIT_MB: "70"
      - name: Memory report
        if: always()
        run: |
          test -f dist/rss.json && cat dist/rss.json || true
          if [ -f dist/rss.json ]; then
            python3 -c "import json; r=json.load(open('dist/rss.json')); print(f\"### hello app memory: working set {r['working_set_mb']} MB (limit {r['limit_mb']} MB), RSS {r['rss_mb']} MB, PSS {r['pss_mb']} MB\")" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rss
          path: dist/rss.json
          if-no-files-found: ignore
  candidate-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the candidate images
        run: |
          for img in runtime:bdh-app-runtime supervisor:bdh-supervisor; do
            docker build -q -f "${img%%:*}/Dockerfile" -t "${img#*:}:candidate" \
              --label "org.opencontainers.image.revision=${{ github.event.pull_request.head.sha || github.sha }}" .
          done
          mkdir -p "$RUNNER_TEMP/images"
          docker save -o "$RUNNER_TEMP/images/candidates.tar" bdh-app-runtime:candidate bdh-supervisor:candidate
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-images
          path: ${{ runner.temp }}/images
          retention-days: 1
          compression-level: 0

  stack-e2e:
    # These images with the hub, SDK and fixture apps pinned by the hub's
    # stack.lock.json, end to end (BlackDiamondHub tests/e2e).
    needs: candidate-images
    uses: blackdiamondhub/BlackDiamondHub/.github/workflows/stack-e2e.yml@dba0a26f7c2f458a22c1a601fc8646e396a19b6d
    with:
      supervisor_image: bdh-supervisor:candidate
      runtime_image: bdh-app-runtime:candidate
      images_artifact: candidate-images
